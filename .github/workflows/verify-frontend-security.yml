name: Frontend dependency security verification

on:
  push:
    branches:
      - fix/frontend-vite-security

permissions:
  contents: read

jobs:
  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=moderate

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
