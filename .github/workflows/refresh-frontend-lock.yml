name: Refresh frontend dependency lockfile

on:
  push:
    branches:
      - fix/frontend-vite-security

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dependency-fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/frontend-vite-security

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate lockfile without executing package scripts
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: refresh frontend dependency lockfile"
          git push origin HEAD:fix/frontend-vite-security
